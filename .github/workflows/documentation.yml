# Manifest-driven document/diagram build (docs/tools/document_build.py).
#
# COST: manual dispatch only. CI minutes are expensive, and this pipeline is
# opt-in (.agents/skills/doc-build-setup/SKILL.md) — a project that never ran
# that skill's setup has no document-build.json entries worth building here,
# and one that did still only needs this on request, not on every push. No
# agent dispatches it unless the owner says to (.forge/ci-and-checks.md).
name: documentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PANDOC_VERSION: "3.11"
      PANDOC_SHA256: "89d4c9d97818c62a97157f0072844e4602c6cee795bf84abd1aee7273abcda99"
      D2_VERSION: "0.9.0"
      D2_SHA256: "5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9"
    steps:
      # Pinned to a full commit SHA (.forge/code-shape-rules.md, "Pinned
      # dependencies"). Verify this SHA against the action's v4.2.2 release
      # before first use, and move it only in its own ticketed PR.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the installer's pins still match the manifest
        # The manifest (docs/tools/document-build.json) is this project's own
        # record of which toolchain version it builds against; the versions
        # below are a second, independent pin on the exact binaries this job
        # downloads and checksums. A project that moves the manifest's pin
        # without moving this job's pin (and its checksum) would silently
        # build with the wrong pandoc/d2 — so this step fails loudly instead,
        # and the fix is to update both together in the one ticketed PR
        # "Pinned dependencies (Never)" already requires for a version move.
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys

          try:
              with open("docs/tools/document-build.json") as f:
                  manifest = json.load(f)
          except FileNotFoundError:
              print(
                  "docs/tools/document-build.json is missing: this project hasn't run "
                  "doc-build-setup yet, so there's no manifest to build or cross-check against.",
                  file=sys.stderr,
              )
              sys.exit(1)
          toolchain = manifest.get("toolchain", {})

          mismatches = []
          for tool, env_var in (("pandoc", "PANDOC_VERSION"), ("d2", "D2_VERSION")):
              manifest_version = toolchain.get(tool, {}).get("version")
              job_version = os.environ[env_var]
              if manifest_version != job_version:
                  mismatches.append(
                      f"{tool}: manifest pins {manifest_version!r}, this job pins {job_version!r}"
                  )

          if mismatches:
              print("docs/tools/document-build.json disagrees with this workflow's pins:", file=sys.stderr)
              for line in mismatches:
                  print(f"  {line}", file=sys.stderr)
              print(
                  "Update documentation.yml's pinned version and checksum in the same PR "
                  "that moves the manifest's pin.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PYEOF

      - name: Install pandoc (pinned, checksum-verified)
        run: |
          curl -sSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  pandoc.deb" | sha256sum -c -
          sudo dpkg -i pandoc.deb
          rm pandoc.deb

      - name: Install d2 (pinned, checksum-verified)
        run: |
          curl -sSL -o d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  d2.tar.gz" | sha256sum -c -
          tar -xzf d2.tar.gz
          sudo install -m 0755 "d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2
          rm -rf d2.tar.gz "d2-v${D2_VERSION}"

      - name: Install weasyprint and its Python dependencies
        run: python3 -m pip install -r docs/tools/requirements.txt

      - name: Build every manifest document
        run: python3 docs/tools/document_build.py

      # One artifact per output format, not per document: the manifest's
      # document list varies by project, so per-document artifact names
      # aren't knowable here the way the reference implementation's own
      # (project-specific) workflow names them.
      # Pinned to a full commit SHA; verify before first use (see above).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-pdfs
          path: docs/_build/pdfs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-pptx
          path: docs/_build/pptx/
          if-no-files-found: ignore
